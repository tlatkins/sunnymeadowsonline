---
title: News
layout: layout.html
---

<!-- Show List of All News Posts -->

{% for post in collections.news -%}
<article class="news-item">
    <span class="news-date">{{ post.data.date }}</span>
    <h3>{{ post.data.title }}</h3>
    {{ post.templateContent}}
</article>
{% endfor -%}
