<!DOCTYPE HTML>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
</head>

	<!-- Google Analytics -->

	<script async src="https://www.googletagmanager.com/gtag/js?id=UA-1777529-9"></script>
	<script>
	window.dataLayer = window.dataLayer || [];
	function gtag(){dataLayer.push(arguments);}
	gtag('js', new Date());

	gtag('config', 'UA-1777529-9');
	</script>
	
	<!-- Viewport info for mobile -->

	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<!-- Google Fonts -->

	<link href="https://fonts.googleapis.com/css?family=Cardo|Raleway|Source+Sans+Pro&display=swap" rel="stylesheet">
	<script src="https://kit.fontawesome.com/3a3b466b49.js" crossorigin="anonymous"></script>

<body>

	<!-- Global Stylesheet for Site -->
	
	<link href="/assets/styles.css" rel="stylesheet"/>
	
	<!-- Hero Image and Navigation Bar Overlay -->
	
	<header class="hero">
		<section class="topbar">
			<div class="logowrapper"><a href="/">Sunny Meadows</a></div>
			<input type="checkbox" id="nav-toggle" class="nav-toggle">
			<label for="nav-toggle" class="hamburger" aria-label="Toggle navigation">
				<span></span><span></span><span></span>
			</label>
			<nav class="menu">
				<ul>
					<li><a href="/">Home</a></li>
					<li><a href="/covenant">Covenant</a></li>
					<li><a href="/dues">Dues</a></li>
				</ul>
			</nav>
		</section>

		<div class="hero-content">
			<h1>{{ heroTitle | default: title }}</h1>
			{% if heroSubtitle %}<p class="hero-subtitle">{{ heroSubtitle }}</p>{% endif %}
			{% if heroActions %}
			<div class="hero-actions">
				{% for action in heroActions %}
				<a class="btn {{ action.style }}" href="{{ action.url }}">{{ action.label }}</a>
				{% endfor %}
			</div>
			{% endif %}
		</div>
	</header>

<section class="main">

{{ content }}

</section>

<!-- Footer -->

<footer>&copy; 2026 Sunny Meadows Homeowner's Association</footer>
</body>
</html>
